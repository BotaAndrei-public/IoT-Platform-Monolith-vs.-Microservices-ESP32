apiVersion: v1
kind: Secret
metadata:
  name: iot-secrets
  namespace: iot-platform
type: Opaque
stringData:
  # Database Configuration
  DATABASE_URL: "postgresql://YOUR_DB_USER:YOUR_DB_PASSWORD@timescaledb:5432/YOUR_DB_NAME"
  POSTGRES_USER: "YOUR_POSTGRES_USER"
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD"
  POSTGRES_DB: "YOUR_POSTGRES_DB"

  # In-Memory Cache & Message Broker Services
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka:9092"

  # Google OAuth Configuration
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  GOOGLE_REDIRECT_URI: "http://localhost:8080/api/auth/google/callback"

  # JWT Authentication
  JWT_SECRET: "YOUR_SECURE_RANDOM_JWT_SECRET"
  JWT_EXPIRES_IN: "7d"

  # MinIO Object Storage Configuration
  MINIO_HOST: "minio"
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: "YOUR_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "YOUR_MINIO_SECRET_KEY"
  MINIO_BUCKET: "iot-archive"

  # Client & Environment Settings
  CLIENT_URL: "http://localhost:8080"
  ALLOWED_ORIGINS: "http://localhost:8080"
  MISSING_DATA_THRESHOLD_MINUTES: "10"
  NODE_ENV: "production"

  # Benchmark Load Simulator Configuration
  SIMULATOR_API_KEYS: "YOUR_SIMULATOR_API_KEY"
  SIMULATOR_SENSOR_IDS: "YOUR_SIMULATOR_SENSOR_UUID"