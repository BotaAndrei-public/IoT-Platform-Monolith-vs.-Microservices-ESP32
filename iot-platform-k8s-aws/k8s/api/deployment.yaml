apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: iot-platform
  labels:
    app: api
spec:
  replicas: 8
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0   
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: iot-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: iot-secrets
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "256Mi"
              cpu:    "200m"
            limits:
              memory: "1Gi"
              cpu:    "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds:       15
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: iot-platform
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: iot-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 8
  maxReplicas: 64
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

